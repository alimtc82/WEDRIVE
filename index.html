<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
    <meta name="theme-color" content="#f2f5fa"/>
    <meta name="description" content="كابتن بنها — اطلب مشوارك أو اعمل ككابتن داخل بنها: تتبع حي وأسعار تفاوضية"/>
    <meta name="mobile-web-app-capable" content="yes"/>
    <meta name="apple-mobile-web-app-capable" content="yes"/>
    <meta name="apple-mobile-web-app-status-bar-style" content="default"/>
    <title>كابتن بنها</title>
    <script>
      // تطبيق الثيم قبل تحميل التطبيق — الافتراضي نهاري
      (function(){
        var t = "light";
        try { t = localStorage.getItem("wd-theme") || "light"; } catch(e){}
        document.documentElement.dataset.theme = t;
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute("content", t === "light" ? "#f2f5fa" : "#0f1729");
      })();
    </script>
  </head>
  <body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body>
</html>
